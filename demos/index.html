<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Демо шаблонов сайтов</title>
  <style>
    body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#0b0f19;color:#e8edf7;margin:0;padding:60px 20px}
    .wrap{max-width:900px;margin:0 auto}
    h1{text-align:center;margin-bottom:10px}
    p.sub{color:#94a3b8;text-align:center;margin-bottom:40px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}
    a.card{background:#151b2b;border:1px solid #1e2740;border-radius:14px;padding:28px;text-align:center;color:#e8edf7;text-decoration:none;font-size:18px;font-weight:600}
    a.card:hover{border-color:#4f8cff}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Демо шаблонов сайтов</h1>
    <p class="sub">Готовые сайты под разные ниши — доставка за 48 часов.</p>
    <div class="grid">
      <a class="card" href="dental.html">🦷 Стоматология</a>
      <a class="card" href="autoservice.html">🔧 Автосервис</a>
      <a class="card" href="cafe.html">☕ Кофейня</a>
      <a class="card" href="beauty.html">💅 Салон красоты</a>
    </div>
  </div>
</body>
</html>
